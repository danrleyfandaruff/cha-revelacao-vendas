<svg width="1800" height="1320" viewBox="0 0 1800 1320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 34px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #25324A; }
      .section-title { font: 700 16px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #4A5568; letter-spacing: 0.04em; }
      .lane-label { font: 700 12px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #5B6475; }
      .card-title { font: 700 13px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #2D3748; }
      .card-text { font: 600 12px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #2D3748; }
      .card-text-small { font: 600 11px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #2D3748; }
      .note-title { font: 700 18px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #364152; }
      .note-text { font: 500 14px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #4B5563; }
      .muted { fill: #7C8798; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">

  <rect width="1800" height="1320" fill="#F6F8FC"/>
  <rect x="28" y="28" width="1744" height="1264" rx="28" fill="#FFFFFF"/>

  <text x="70" y="96" class="title">Nova Autenticação WhatsApp Corretor</text>
  <text x="70" y="126" class="note-text">Fluxo reorganizado para leitura mais clara no Miro, mantendo as jornadas e integrações do diagrama original.</text>


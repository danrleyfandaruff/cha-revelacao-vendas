  <g transform="translate(1340 170)" filter="url(#shadow)">
    <rect width="390" height="390" rx="24" fill="#FFFDF8" stroke="#E6DFC8" stroke-width="2"/>
    <text x="28" y="42" class="note-title">Informações</text>
    <rect x="28" y="68" width="334" height="1" fill="#E5E7EB"/>
    <text x="28" y="112" class="note-text">Corretor fica logado por 120 minutos,</text>
    <text x="28" y="136" class="note-text">entao novas jornadas podem reutilizar</text>
    <text x="28" y="160" class="note-text">a mesma autenticacao dentro desse periodo.</text>

    <text x="28" y="214" class="note-text">Para jornadas sensíveis, o fluxo pede</text>
    <text x="28" y="238" class="note-text">nova autenticacao apenas quando necessario.</text>

    <text x="28" y="292" class="note-text">Existe dependencia de um endpoint que</text>
    <text x="28" y="316" class="note-text">informa se o corretor já está autenticado</text>
    <text x="28" y="340" class="note-text">ou se precisa iniciar o processo novamente.</text>
  </g>

  <g transform="translate(1340 590)" filter="url(#shadow)">
